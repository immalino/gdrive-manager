services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gdrive
      POSTGRES_PASSWORD: gdrive
      POSTGRES_DB: gdrive_manager
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gdrive']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
